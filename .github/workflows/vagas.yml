name: JobMatch AI

on:
  schedule:
    # Agendamento do GitHub Actions é best-effort. Duas causas identificadas
    # neste repositório:
    #   1) alta frequência (7x/dia) — reduzida para 4x/dia, mas isso sozinho
    #      NÃO resolveu: 2 dos 2 slots seguintes ainda foram descartados;
    #   2) todos os horários caíam em minuto ":00" — o instante mais
    #      concorrido de cada hora, quando o maior número de crons de outros
    #      repositórios dispara. A própria documentação do GitHub recomenda
    #      evitar ":00"/":15"/":30"/":45" por esse motivo. Deslocado para
    #      ":07" como segundo experimento antes de migrar para um agendador
    #      externo (ex.: cron-job.org chamando a API de workflow_dispatch).
    - cron: '7 12,15,18,21 * * 1-5'   # Seg-Sex: ~9h, ~12h, ~15h, ~18h (BRT)
    - cron: '7 14,20 * * 0,6'         # Sáb-Dom: ~11h, ~17h (BRT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rodar sem enviar ao Telegram'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Duas execuções simultâneas brigariam pelo commit do vagas_gupy.db.
  group: jobmatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt
          # SDK do LLM só é instalado quando há provider configurado — mantém
          # a execução leve nas rodadas sem IA.
          if [ -n "${{ vars.LLM_PROVIDER }}" ] && [ "${{ vars.LLM_PROVIDER }}" != "none" ]; then
            pip install -r requirements-ai.txt
          fi

      - name: Rodar testes
        # As regras críticas (senioridade não elimina, localização por modelo
        # de trabalho) são verificadas antes de qualquer envio.
        run: python -m pytest tests/ -q

      - name: Executar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID_GRUPO: ${{ secrets.CHAT_ID_GRUPO }}
          # Opcionais: sem eles o bot roda em modo heurístico + embedding local.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'none' }}
          # Teto de mensagens por execução. Ajustável sem mexer no código pela
          # variável MAX_JOBS_PER_RUN do repositório.
          MAX_JOBS_PER_RUN: ${{ vars.MAX_JOBS_PER_RUN || '15' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_JOBS: ${{ vars.LLM_MAX_JOBS || '15' }}
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'hashing' }}
          # VECTOR_STORE fica em `memory`: o índice do perfil tem ~25 chunks e
          # é reconstruído a cada execução, então não há estado para persistir
          # entre runs do Actions.
          VECTOR_STORE: memory
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python main.py

      - name: Salvar banco de dados atualizado
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "JobMatch AI"
          git add vagas_gupy.db
          git diff --staged --quiet || git commit -m "chore: atualiza vagas_gupy.db [skip ci]"
          git pull --rebase --autostash || true
          git push
