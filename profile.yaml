# -----------------------------------------------------------------------------
# TAXONOMIA DE SKILLS
# -----------------------------------------------------------------------------
# Grupos de tecnologias relacionadas. Sustentam o crédito por competência
# transferível: a vaga pede Pinecone, o perfil tem ChromaDB — ambos em `rag`,
# então isso vira compatibilidade parcial, não gap.
#
# Os membros incluem DE PROPÓSITO tecnologias que o perfil não tem: é
# justamente isso que permite reconhecer a vizinhança.
#
# `transfer_factor` (0..1) calibra quanto do peso da skill vizinha é
# aproveitado. Proximidades diferentes valem coisas diferentes:
# ChromaDB→Pinecone é quase equivalente (0.75); Docker→Kubernetes é um salto
# grande (0.30) e não pode inflar vaga de SRE.
skill_groups:

  frontend_frameworks:
    transfer_factor: 0.65
    members: [react, react.js, next.js, nextjs, vue, vue.js, nuxt, angular,
              preact, svelte, sveltekit, solidjs, ember, remix, astro, spa,
              single page application, componentizacao]

