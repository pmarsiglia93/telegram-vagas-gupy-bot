  # perfil (IA aplicada, RAG, automação). Pequeno de propósito: é diferencial
  # competitivo, não substituto de aderência técnica.
  emergent_bonus: 4

# Famílias de tecnologia: sustentam o crédito por "tecnologia transferível".
# Se a vaga pede Vue e o perfil tem React, ambos estão em `frontend_spa` →
# crédito parcial em vez de gap total.
