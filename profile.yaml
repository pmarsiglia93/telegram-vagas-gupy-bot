# =============================================================================
# PERFIL PROFISSIONAL — JobMatch AI
# =============================================================================
# Este arquivo é a ÚNICA fonte de verdade sobre o candidato. Nada de perfil
# deve estar hardcoded no código Python.
#
# EVIDÊNCIA (`evidence`) — cada skill lista as PROVAS de que a competência
# existe. Uma skill pode ter várias; a mais forte define como ela é
# apresentada, e as demais somam um bônus pequeno e limitado.
#
# A pergunta deixou de ser "tem experiência profissional? sim/não" e passou a
# ser "qual é a evidência?". Conhecimento real conta — sem nunca ser
# apresentado como emprego formal.
#
#   professional        1.00  usou em produção, remunerado, vínculo formal
#   freelance           0.95  usou em produção, remunerado, autônomo
#   production_project  0.85  projeto próprio rodando de verdade
#   project             0.75  projeto próprio / portfólio publicado
#   academic_project    0.62
#   knowledge / hands_on 0.60 sabe aplicar / POC, laboratório
#   certification       0.55
#   course              0.48  curso ou bootcamp concluído
#   study               0.40  estudando agora
#   interest            0.20
#
# `note` é o que sustenta a afirmação. Preencha com fatos verificáveis —
# é isso que impede o LLM de inventar contexto.
# =============================================================================

identity:
  name: Paulo Marsiglia
