              webhook, webhooks, integracao de apis, openapi, swagger, grpc,
              soap, web services, servicos http, axios, fetch api]

  version_control:
    # Git/GitHub NÃO transferem para observabilidade, IaC ou nuvem. Antes,
    # tudo isso caía na família ampla `infra`, cujo "melhor" era Git — e
    # Datadog/Grafana/Prometheus herdavam 55% do peso de Git (33 ocorrências
    # no dataset real). Grupo próprio encerra esse caminho.
    transfer_factor: 0.60
    members: [git, github, gitlab, bitbucket, versionamento, controle de versao,
              subversion, svn, mercurial, pull request, code review]

  containers:
    transfer_factor: 0.60
    members: [docker, container, containers, docker compose, containerizacao,
              containerization, podman, buildah, containerd]

  orchestration:
    # Docker entra aqui de propósito, com fator BAIXO: conhecer container é
    # adjacente a orquestrar container, mas está longe de operá-la. É a única
    # ponte que sustenta Docker -> Kubernetes como transferência fraca.
    transfer_factor: 0.25
    members: [kubernetes, k8s, openshift, helm, argocd, eks, aks, gke, nomad,
              service mesh, istio, docker]

  observability:
    # Sem skill de observabilidade no perfil: o grupo existe para nomear o gap
    # com precisão e impedir que ele seja preenchido por outra família.
    transfer_factor: 0.60
    members: [observabilidade, observability, datadog, grafana, prometheus,
