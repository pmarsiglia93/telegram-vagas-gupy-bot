# -----------------------------------------------------------------------------
# PROJETOS
# -----------------------------------------------------------------------------
projects:
  - id: proj_jobmatch_ai
    name: JobMatch AI — sistema de recomendação de vagas
    type: personal_project
    level: production_project
    url: https://github.com/pmarsiglia93/telegram-vagas-gupy-bot
    technologies: [python, rag, embeddings, vector database, chromadb, llm,
                   openai, anthropic, gemini, prompt engineering, structured outputs,
                   semantic search, sqlite, github actions, ci/cd, telegram api,
                   rest apis, webhooks, automacao, testes automatizados,
                   arquitetura de software]
    summary: >
      Sistema automatizado de descoberta e recomendação de vagas, em produção e
      rodando 10x por dia via GitHub Actions. Coleta oportunidades de três
      fontes (API da Gupy, API guest do LinkedIn e scraping do ProgramaThor),
      normaliza tudo em um modelo único de vaga e extrai requisitos reais da
      descrição. Indexa o perfil profissional em chunks semânticos, gera
      embeddings e usa RAG para recuperar os trechos relevantes a cada vaga,
      que alimentam uma análise estruturada por LLM validada contra JSON
      Schema. Implementa camada de providers plugáveis para LLM, embeddings e
      vector store (memória e ChromaDB), fallback em cada camada de IA para que
      falha de IA nunca impeça o envio, deduplicação por fingerprint em SQLite,
      score de compatibilidade 0-100 com análise de gaps e notificação no
      Telegram. Coberto por suíte de testes automatizados executada no CI.

  - id: proj_mba_react_native
    name: Aplicativo mobile — Trabalho de Conclusão do MBA (USP)
    type: academic_project
    level: academic_project
    technologies: [react native, javascript, typescript, mobile]
    domains: [mobile, startups, empreendedorismo, validação de produto]
    summary: >
      Aplicativo mobile desenvolvido em React Native como trabalho de conclusão
      de curso do MBA na USP. O projeto foi validado pelo Sebrae, aprovado numa
      aceleradora de startups e recebeu nota máxima na avaliação do MBA. Não é
      experiência profissional remunerada, mas é evidência concreta de
      construção completa de um app mobile em React Native, do zero à validação
      externa por terceiros.

